[workspace]
resolver = "2"
members = ["crates/femux-*", "crates/plugins/*"]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
termwiz = "0.23"
