name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the Rust and Zig versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
      # Zig's global cache holds the fetched Ghostty source and its build artifacts.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
          key: zig-${{ runner.os }}-${{ hashFiles('zig-version', 'crates/femux-vt/zig/build.zig.zon') }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
