[package]
name = "femux-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

# REQ-ARCH-001 / SPEC §17.4: no terminal, UI or agent libraries in this crate.
[dependencies]
femux-proto = { path = "../femux-proto" }
femux-vt = { path = "../femux-vt" }
tokio.workspace = true
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "user", "ioctl"] }
libc = "0.2"
femux-config = { path = "../femux-config" }
femux-log = { path = "../femux-log" }
ulid = "1"
rmpv = "1"
regex = "1"
rusqlite.workspace = true
serde_json = "1"
flate2 = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# REQ-STORE-003: logind's PrepareForShutdown, best effort (Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
