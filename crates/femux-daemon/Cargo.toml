[package]
name = "femux-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

# REQ-ARCH-001 / SPEC §17.4: no terminal, UI or agent libraries in this crate.
[dependencies]
femux-proto = { path = "../femux-proto" }
femux-vt = { path = "../femux-vt" }
tokio.workspace = true
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "user", "ioctl"] }
libc = "0.2"
ulid = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
