[package]
name = "femux-plugin-infobar"
version = "0.4.0"
edition.workspace = true
license.workspace = true

# REQ-PLUG-003: plugins depend on femux-plugin and femux-proto.
[dependencies]
femux-plugin = { path = "../../femux-plugin" }
femux-proto = { path = "../../femux-proto" }
sysinfo = { version = "0.37", default-features = false, features = ["system", "network"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
