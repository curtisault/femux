[package]
name = "femux-plugin-hosts"
version = "0.6.0"
edition.workspace = true
license.workspace = true

# REQ-PLUG-003: plugins depend on femux-plugin and femux-proto (and the femux-config parser).
[dependencies]
femux-plugin = { path = "../../femux-plugin" }
femux-proto = { path = "../../femux-proto" }
femux-config = { path = "../../femux-config" }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "network"] }

[dev-dependencies]
femux-test = { path = "../../femux-test" }
tokio.workspace = true
