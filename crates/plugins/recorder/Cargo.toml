# REQ-PLUG-003: plugins depend on femux-plugin and femux-proto (and the femux-config parser).
[dependencies]
femux-plugin = { path = "../../femux-plugin" }
femux-proto = { path = "../../femux-proto" }
femux-config = { path = "../../femux-config" }
