[package]
name = "femux-client"
version.workspace = true
edition.workspace = true
license.workspace = true

# REQ-ARCH-002: the client reaches the daemon only through femux-proto.
[dependencies]
femux-proto = { path = "../femux-proto" }
femux-plugin = { path = "../femux-plugin" }
termwiz.workspace = true
